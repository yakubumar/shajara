<script>
(function(){

var config={url:'',key:''};
function $(id){return document.getElementById(id)} function clone(x){return JSON.parse(JSON.stringify(x))} function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})} function uid(){return (crypto&&crypto.randomUUID)?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){var r=Math.random()*16|0,v=c==='x'?r:(r&3|8);return v.toString(16)})}

function loadConfig(){try{var x=JSON.parse(localStorage.getItem(CONFIG_KEY));if(x&&x.url&&x.key)config=x}catch(e){}} function saveConfig(){localStorage.setItem(CONFIG_KEY,JSON.stringify(config))}
function loadSession(){if(isViewer){session=null;isAdmin=false;return}try{var x=JSON.parse(localStorage.getItem(SESSION_KEY));if(x&&x.access_token&&x.user)session=x}catch(e){session=null}}

function authApi(path,opts){if(!config.url||!config.key)return Promise.reject(new Error('Supabase уланмаган'));var o=opts||{};o.headers=Object.assign({'apikey':config.key,'Content-Type':'application/json','Accept':'application/json'},o.headers||{});return fetch(config.url.replace(/\/$/,'')+'/auth/v1/'+path,o).then(function(r){return r.text().then(function(t){if(!r.ok)throw new Error(t||('HTTP '+r.status));return t?JSON.parse(t):null})})}
function api(path,opts){if(!config.url||!config.key)return Promise.reject(new Error('Supabase уланмаган'));var o=opts||{};o.headers=Object.assign({'apikey':config.key,'Authorization':'Bearer '+(session&&session.access_token?session.access_token:config.key),'Content-Type':'application/json','Accept':'application/json'},o.headers||{});return fetch(config.url.replace(/\/$/,'')+'/rest/v1/'+path,o).then(function(r){return r.text().then(function(t){if(!r.ok)throw new Error(t||('HTTP '+r.status));return t?JSON.parse(t):null})})}
function updateModeUI(){
  $('add').style.display=isAdmin?'inline-block':'none';
  $('undo').style.display=isAdmin?'inline-block':'none';
  $('import').style.display=isAdmin?'inline-block':'none';
  $('export').style.display=isAdmin?'inline-block':'none';

}
function checkAdmin(){if(!session||!session.access_token){isAdmin=false;updateModeUI();return Promise.resolve(false)}
  return api('rpc/has_role',{method:'POST',body:JSON.stringify({required_role:'admin'})}).then(function(v){isAdmin=v===true;updateModeUI();return isAdmin}).catch(function(){isAdmin=false;session=null;saveSession();updateModeUI();return false})}

function doLogin(){var email=$('loginEmail').value.trim(),password=$('loginPassword').value;if(!email||!password){toast('Email ва парольни киритинг');return} $('loginSubmit').disabled=true;authApi('token?grant_type=password',{method:'POST',body:JSON.stringify({email:email,password:password})}).then(function(x){session={access_token:x.access_token,refresh_token:x.refresh_token,user:{id:x.user&&x.user.id,email:x.user&&x.user.email}};saveSession();return checkAdmin()}).then(function(ok){if(!ok)throw new Error('Бу аккаунтга admin ҳуқуқи берилмаган');$('authBg').style.display='none';toast('Админ режими ёқилди ✓');loadRemote()}).catch(function(e){session=null;saveSession();isAdmin=false;updateModeUI();toast('Киришда хато: '+(e.message||'пароль ёки email нотўғри'))}).finally(function(){$('loginSubmit').disabled=false})}
function setStatus(s,ok){$('status').textContent=s;$('status').style.color=ok?'#28734b':'#9a4b3f'}
function normalize(row){return {id:row.id,firstName:row.name||'',lastName:row.last_name||'',birthYear:row.birth_year||null,birthApprox:row.birth_approx===true,isAlive:row.is_alive!==false,deathYear:row.death_year||null,deathApprox:row.death_approx===true,motherOther:row.mother_other===true,fatherId:row.father_id||null}}
function row(p){return {id:p.id,name:p.firstName||'',last_name:p.lastName||'',birth_year:p.birthYear||null,birth_approx:p.birthApprox===true,is_alive:p.isAlive!==false,death_year:p.isAlive===false?(p.deathYear||null):null,death_approx:p.isAlive===false&&p.deathYear?!!p.deathApprox:false,mother_other:p.motherOther===true,father_id:p.fatherId||null}}
function loadRemote(){setStatus('Юкланмоқда...',false);return api('persons?select=id,name,last_name,birth_year,birth_approx,is_alive,death_year,death_approx,mother_other,father_id&order=created_at.asc').then(function(data){persons=(data||[]).map(normalize);setStatus('Онлайн ✓',true);selected=null;highlights=null;render()}).catch(function(e){setStatus('Хато',false);toast('Базадан ўқишда хато: '+e.message);throw e})}
function createRemote(p){return api('persons',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify(row(p))})}

function deleteRemote(id){return api('persons?id=eq.'+encodeURIComponent(id),{method:'DELETE',headers:{Prefer:'return=minimal'}})}
function push(){history.push(clone(persons));if(history.length>10)history.shift();$('undo').disabled=false}
function undo(){if(!isAdmin||!history.length)return;var old=history.pop(),before=clone(persons);persons=old;$('undo').disabled=!history.length;syncFull(before,old).then(function(){selected=null;highlights=null;render();toast('Бекор қилинди')}).catch(function(e){persons=before;toast('Бекор қилишда хато: '+e.message)})}
function syncFull(before,after){var b={},a={};before.forEach(function(p){b[p.id]=p});after.forEach(function(p){a[p.id]=p});var jobs=[];Object.keys(a).forEach(function(id){if(!b[id])jobs.push(createRemote(a[id]));else if(JSON.stringify(row(a[id]))!==JSON.stringify(row(b[id])))jobs.push(updateRemote(a[id]))});Object.keys(b).forEach(function(id){if(!a[id])jobs.push(deleteRemote(id))});return Promise.all(jobs)}
function byBirth(a,b){var ay=a.birthYear?+a.birthYear:null,by=b.birthYear?+b.birthYear:null;if(ay==null&&by==null)return (a.firstName+' '+a.lastName).localeCompare(b.firstName+' '+b.lastName,'uz');if(ay==null)return 1;if(by==null)return -1;return ay-by} function kids(id){return persons.filter(function(p){return p.fatherId===id}).sort(byBirth)} function roots(){return persons.filter(function(p){return !p.fatherId||!persons.some(function(x){return x.id===p.fatherId})}).sort(byBirth)}

function render(){var stage=$('stage'),pos=layout(),svg='<svg width="1" height="1" style="position:absolute;overflow:visible"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8a8375"/></marker></defs>';persons.forEach(function(p){if(!p.fatherId||!pos[p.id]||!pos[p.fatherId])return;var a=pos[p.fatherId],b=pos[p.id],x1=a.x+75,y1=a.y+65,x2=b.x+75,y2=b.y+2,m=(y1+y2)/2;svg+='<path d="M'+x1+','+y1+' C'+x1+','+m+' '+x2+','+m+' '+x2+','+y2+'" stroke="#8a8375" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>'});svg+='</svg>';var cards='';persons.slice().sort(byBirth).forEach(function(p){if(!pos[p.id])return;var nm=(p.firstName+' '+p.lastName).trim()||'Исмсиз',yb=p.birthYear?String(p.birthYear)+(p.birthApprox?' (тахм.)':''):'',yd=p.deathYear?String(p.deathYear)+(p.deathApprox?' (тахм.)':''):'',yr=p.isAlive?yb:(yb&&yd?yb+'–'+yd:(yb?yb+'–':(yd?'–'+yd:'')));cards+='<div class="card '+(p.isAlive?'alive ':'dead ')+(highlights&&!highlights[p.id]?'dim ':'')+(selected===p.id?'selected':'')+'" data-id="'+p.id+'" style="left:'+pos[p.id].x+'px;top:'+pos[p.id].y+'px"><div class="name">'+esc(nm)+'</div><div class="years">'+esc(yr)+'</div>'+(p.motherOther?'<div class="motherOther">Она бошқа</div>':'')+'</div>'});stage.innerHTML=svg+cards;stage.querySelectorAll('.card').forEach(function(ca){ca.onclick=function(e){e.stopPropagation();select(ca.getAttribute('data-id'))}});showActions()}

function fatherList(ex){var h='';persons.forEach(function(p){if(ex.indexOf(p.id)>=0)return;h+='<option value="'+p.id+'">'+esc((p.firstName+' '+p.lastName).trim()||'Исмсиз')+'</option>'});return h}
function setLifeState(dead){var btn=$('life'),inp=$('death'),da=$('deathApprox');btn.textContent=dead?'Вафот этган':'Ҳаёт';btn.classList.toggle('dead',dead);inp.disabled=!dead;da.disabled=!dead;inp.placeholder=dead?'Йилни киритинг':'Аввал «Ҳаёт» тугмасини босинг';if(!dead){inp.value='';da.checked=false}}

function autoSaveEdit(){if(!isAdmin||!modalMode||autoSaving)return;clearTimeout(autoSaveTimer);autoSaveTimer=setTimeout(function(){var next=formPersonFromModal();if(!next||(!next.firstName&&!next.lastName))return;var p=persons.find(function(x){return x.id===modalMode});if(!p)return;var before=clone(p);Object.assign(p,next);autoSaving=true;updateRemote(p).then(function(){toast('Автоматик сақланди ✓')}).catch(function(e){Object.assign(p,before);render();toast('Автоматик сақлашда хато: '+e.message)}).finally(function(){autoSaving=false})},600)}
function openModal(editId){if(!isAdmin){toast('Фақат админ таҳрирлай олади');return} modalMode=editId;$('modalTitle').textContent=editId?'Одамни таҳрирлаш':'Одам қўшиш';var p=editId?persons.find(function(x){return x.id===editId}):null;$('first').value=p?p.firstName:'';$('last').value=p?p.lastName:'';$('birth').value=p&&p.birthYear?p.birthYear:'';$('death').value=p&&p.deathYear?p.deathYear:'';$('birthApprox').checked=!!(p&&p.birthApprox);$('deathApprox').checked=!!(p&&p.deathApprox);$('motherOther').checked=!!(p&&p.motherOther);setLifeState(!!(p&&p.isAlive===false));$('father').disabled=false;$('father').innerHTML=fatherList(editId?[editId]:[]);if(p&&p.fatherId)$('father').value=p.fatherId;$('fatherField').style.display=editId?'none':'block';$('modalBg').style.display='flex'}

function savePerson(){if(!isAdmin){toast('Фақат админ сақлай олади');return}
var f=$('first').value.trim(),l=$('last').value.trim(),b=$('birth').value,d=$('death').value,fa=$('father').value||null,ba=$('birthApprox').checked,da=$('deathApprox').checked,mo=$('motherOther').checked;

function isUUID(v){return typeof v==='string'&&/^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(v)}
function importRemote(before,incoming){
  var jobs=[];
  before.forEach(function(p){jobs.push(deleteRemote(p.id))});
  return Promise.all(jobs).then(function(){
    /* First insert everyone without father_id. This avoids PostgreSQL FK order errors. */
    var base=incoming.map(function(p){var q=row(p);q.father_id=null;return q});
    return Promise.all(base.map(function(q){return api('persons',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(q)})}));
  }).then(function(){
    /* Now all IDs exist, so restore the father links. */
    return Promise.all(incoming.filter(function(p){return !!p.fatherId}).map(function(p){return api('persons?id=eq.'+encodeURIComponent(p.id),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({father_id:p.fatherId})})}));
  });
}
function importData(file){if(!isAdmin){toast('Импорт фақат админ учун');return}if(!file)return;var r=new FileReader();r.onload=function(){try{var x=JSON.parse(r.result);if(!x||!Array.isArray(x.persons))throw 1;

x.persons.forEach(function(p){var old=String(p.id||'');idMap[old]=isUUID(old)?old:uid()});
var incoming=x.persons.map(function(p){var old=String(p.id||'');var fid=p.fatherId==null||p.fatherId===''?null:(idMap[String(p.fatherId)]||null);return {id:idMap[old]||uid(),firstName:p.firstName||'',lastName:p.lastName||'',birthYear:p.birthYear?+p.birthYear:null,birthApprox:p.birthApprox===true,isAlive:p.isAlive!==false,deathYear:p.isAlive===false&&p.deathYear?+p.deathYear:null,deathApprox:p.isAlive===false&&p.deathApprox===true,motherOther:p.motherOther===true,fatherId:fid}});
var before=clone(persons);push();importRemote(before,incoming).then(function(){persons=incoming;render();toast('Импорт қилинди')}).catch(function(e){loadRemote().catch(function(){});toast('Импортда хато: '+e.message)})
}catch(e){alert('JSON файл нотўғри')}};r.readAsText(file)}
